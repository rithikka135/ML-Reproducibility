
name: Reproducible ML with DVC and CML

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data and reproduce pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local origin user rithikka135
          dvc remote modify --local origin password "$DAGSHUB_TOKEN"
          dvc pull
          dvc repro

      - name: Generate metrics report
        run: |
          git fetch origin main
          echo "# ML Experiment Report" > report.md
          echo "## Metrics comparison" >> report.md
          dvc metrics diff main --md >> report.md
          echo "## Parameters comparison" >> report.md
          dvc params diff --md >> report.md

      - name: Post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
